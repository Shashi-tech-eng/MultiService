replicaCount: 2
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "alpine"
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: nginx
  host: app.example.com
  annotations: {}
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi
